services:
  postgres:
    image: postgres:16-alpine
    container_name: civicpact-postgres
    environment:
      POSTGRES_USER: civicpact
      POSTGRES_PASSWORD: civicpact
      POSTGRES_DB: civicpact
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpact -d civicpact"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicpact-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
