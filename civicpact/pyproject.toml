[tool.poetry]
name = "civicpact"
version = "0.1.0"
description = "Enterprise-grade civic intelligence RSS agent platform."
authors = ["CivicPact Engineering <eng@civicpact.local>"]
readme = "README.md"
packages = [
    { include = "value_fabric", from = "shared" },
    { include = "ingestion_l1", from = "services/ingestion_l1/src" },
    { include = "extraction_l2", from = "services/extraction_l2/src" },
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
httpx = "^0.27"
feedparser = "^6.0"
celery = { extras = ["redis"], version = "^5.4" }
playwright = "^1.44"
sqlalchemy = { extras = ["asyncpg"], version = "^2.0" }
asyncpg = "^0.29"
python-dotenv = "^1.0"
structlog = "^24.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.10"
ruff = "^0.4"
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-mock = "^3.14"
respx = "^0.21"

[tool.poetry.scripts]
ingest = "ingestion_l1.cli:main"
extract = "extraction_l2.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "PL",  # Pylint
]
ignore = ["D104", "D100", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "services/ingestion_l1/tests",
    "services/extraction_l2/tests",
    "shared/value_fabric/tests",
]
pythonpath = [
    "services/ingestion_l1/src",
    "services/extraction_l2/src",
    "shared",
]
