# CivicPact linting and formatting configuration.
# This file mirrors the settings in pyproject.toml for tools that read ruff.toml directly.

target-version = "py311"
line-length = 100

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "C4",
    "SIM",
    "ARG",
    "ERA",
    "PL",
]
ignore = ["D104", "D100", "D203", "D213"]

[lint.pydocstyle]
convention = "google"
