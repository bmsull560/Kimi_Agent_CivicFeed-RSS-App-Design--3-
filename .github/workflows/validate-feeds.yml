name: Validate RSS Feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - run: corepack prepare pnpm@10.18.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:feeds -- --strict
      - name: Commit health data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/feed-health.json
          git diff --cached --quiet || (git commit -m "chore: update feed health data [skip ci]" && git push)
